[package]
name = "agent-parity"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Lint MCP declarations across Claude and Codex project and global config"
repository = "https://github.com/TheConnMan/agent-router"

[[bin]]
name = "agent-parity"
path = "src/main.rs"

[dependencies]
agent-router-core = { path = "../agent-router-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "0.9"

[dev-dependencies]
tempfile = "3.27.0"
