[package]
name = "agent-router-cli"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Route a task to codex, claude, or grok by task shape and weekly usage headroom"
repository = "https://github.com/TheConnMan/agent-router"

[[bin]]
name = "agent-router"
path = "src/main.rs"

[dependencies]
agent-router-core = { path = "../agent-router-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1.0.150"
