[package]
name = "agent-router-core"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Routing machinery for agent-router: usage readers, classifier, decision engine, and dispatch"
repository = "https://github.com/TheConnMan/agent-router"

[dependencies]
agent-viewer-core = { git = "https://github.com/TheConnMan/agent-viewer", rev = "d0f9c6f80b880853808666804ac3bafcf9713410" }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
toml = "0.9"
tungstenite = "0.30.0"
ureq = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
tempfile = "3.27.0"
