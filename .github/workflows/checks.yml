name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version gate diffs against a base commit: the PR base ref on a pull request, or
          # HEAD^1 on a merge pushed straight to main. The default depth of 1 has neither.
          fetch-depth: 0
      - name: Check the router version was bumped
        run: scripts/check-version-bump.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # The managed OpenCode tests run the router under `unshare -Urn` to get an isolated
      # network namespace. Ubuntu restricts unprivileged user namespaces by default, which
      # makes unshare fail and surfaces as a fixture that never starts, so lift the restriction
      # rather than letting those tests silently stop covering the loopback checks.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Run tests
        run: cargo test --workspace --locked
